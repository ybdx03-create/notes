[project]
name = "notes-backend"
version = "0.1.0"
description = "Notes web application backend"
requires-python = ">=3.11"
authors = [
    {name = "Notes Team"}
]
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlmodel>=0.0.14",
    "psycopg[binary]>=3.1",
    "python-jose[cryptography]",
    "passlib[bcrypt]",
    "python-multipart"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx"
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Liquid Notes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/css/style.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="앱 탐색">
        <div class="sidebar-header">
          <span class="brand-mark" aria-hidden="true"></span>
          <div>
            <p class="brand-title">spring</p>
            <p class="brand-subtitle">나의 노트 공간</p>
          </div>
        </div>
        <dl class="sidebar-stats">
          <div>
            <dt>전체 노트</dt>
            <dd id="total-notes">0</dd>
          </div>
          <div>
            <dt>이번 주 작성</dt>
            <dd id="weekly-notes">0</dd>
          </div>
          <div>
            <dt>즐겨찾기</dt>
            <dd>—</dd>
          </div>
        </dl>
        <nav class="sidebar-menu">
          <p class="menu-label">폴더</p>
          <ul>
            <li><button type="button" class="menu-item is-active">전체 기록</button></li>
            <li><button type="button" class="menu-item">인사이트</button></li>
            <li><button type="button" class="menu-item">링크 모음</button></li>
            <li><button type="button" class="menu-item">회고</button></li>
          </ul>
        </nav>
        <button type="button" class="sidebar-action" onclick="document.querySelector('#title').focus()">
          + 새 노트 작성
        </button>
      </aside>

      <main class="main-area">
        <header class="main-header">
          <div class="header-info">
            <h1>오늘 무엇을 기록할까요?</h1>
            <p>아이디어, 링크, 기억하고 싶은 순간들을 자유롭게 남겨보세요.</p>
          </div>
          <label class="search-field" for="note-search">
            <input id="note-search" type="search" placeholder="노트 검색" disabled />
          </label>
        </header>

        <section class="composer-section">
          <form id="note-form" class="note-form" autocomplete="off">
            <div class="composer-card">
              <div class="composer-textarea">
                <div class="composer-metadata">
                  <input
                    id="title"
                    name="title"
                    type="text"
                    placeholder="제목을 입력하세요"
                    required
                  />
                  <time id="composer-time" aria-live="polite"></time>
                </div>
                <div class="composer-divider" role="presentation"></div>
                <textarea
                  id="content"
                  name="content"
                  rows="8"
                  placeholder="내용을 입력하면 오른쪽 타임라인에 기록이 쌓입니다."
                  required
                ></textarea>
              </div>
              <div class="form-actions">
                <p class="form-feedback" role="alert" aria-live="polite"></p>
                <button type="submit" class="primary-button">기록 저장</button>
              </div>
            </div>
          </form>
        </section>

        <section class="notes-feed" aria-live="polite">
          <h2 class="visually-hidden">노트 타임라인</h2>
          <div id="notes-list" class="timeline">
            <p class="empty-state">첫 노트를 작성해 나만의 타임라인을 만들어보세요.</p>
          </div>
        </section>
      </main>
    </div>
    <script src="/static/js/main.js" defer></script>
  </body>
</html>

<!doctype html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>流光笔记</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/css/style.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="list-panel" aria-label="笔记列表">
        <header class="list-header">
          <span class="brand-icon" aria-hidden="true"></span>
          <div>
            <p class="brand-title">流光笔记</p>
            <p class="brand-tagline">在洁白画布上存放每一则灵感</p>
          </div>
        </header>
        <button
          type="button"
          class="new-note-button"
          onclick="document.querySelector('#title').focus()"
        >
          <span class="new-note-icon" aria-hidden="true"></span>
          <span class="new-note-copy">
            <strong>写下新灵感</strong>
            <span>一键唤醒纯净灵感页</span>
          </span>
        </button>
        <div class="list-summary" role="list">
          <div class="summary-card" role="listitem">
            <p>总笔记</p>
            <strong id="total-notes">0</strong>
            <span>全部绿色灵感</span>
          </div>
          <div class="summary-card" role="listitem">
            <p>最近 7 天</p>
            <strong id="weekly-notes">0</strong>
            <span>持续保持记录</span>
          </div>
        </div>
        <div id="notes-list" class="notes-list" aria-live="polite">
          <p class="empty-state">还没有任何内容，开始撰写第一条笔记吧。</p>
        </div>
      </aside>

      <main class="editor-panel">
        <header class="editor-header">
          <p class="editor-subheading">今日灵感</p>
          <h1>在纯净空间里写下你的想法</h1>
          <p>标题与内容在同一张卡片内顺滑衔接，保存之后即可在左侧列表中快速浏览。</p>
        </header>

        <form id="note-form" class="note-form" autocomplete="off">
          <div class="editor-card">
            <div class="editor-headline">
              <label class="visually-hidden" for="title">标题</label>
              <input
                id="title"
                name="title"
                type="text"
                placeholder="输入标题，概括这条灵感"
                required
              />
              <time id="composer-time" aria-live="polite"></time>
            </div>
            <div class="editor-divider" role="presentation"></div>
            <div class="editor-content">
              <label class="visually-hidden" for="content">内容</label>
              <textarea
                id="content"
                name="content"
                rows="10"
                placeholder="在这里写下完整的想法、待办或灵感摘录。"
                required
              ></textarea>
            </div>
            <div class="editor-actions">
              <p class="form-feedback" role="alert" aria-live="polite"></p>
              <button type="submit" class="primary-button">收藏这则灵感</button>
            </div>
          </div>
        </form>
      </main>
    </div>
    <script src="/static/js/main.js" defer></script>
  </body>
</html>

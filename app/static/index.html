<!doctype html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>流光笔记</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/css/style.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="list-panel" aria-label="笔记列表">
        <div class="panel-header">
          <div class="brand-block">
            <span class="brand-icon" aria-hidden="true"></span>
            <div class="brand-meta">
              <p class="brand-name">流光笔记</p>
              <p class="brand-slogan">纯净而灵动的灵感库</p>
            </div>
          </div>
          <button
            type="button"
            class="create-note-button"
            onclick="document.querySelector('#title').focus()"
          >
            <span class="create-note-icon" aria-hidden="true">+</span>
            <span class="create-note-copy">立即写笔记</span>
          </button>
          <dl class="stats-grid" role="list">
            <div role="listitem">
              <dt>全部</dt>
              <dd id="total-notes">0</dd>
              <small>保存的灵感</small>
            </div>
            <div role="listitem">
              <dt>近 7 天</dt>
              <dd id="weekly-notes">0</dd>
              <small>持续记录</small>
            </div>
          </dl>
        </div>
        <div id="notes-list" class="notes-scroll" aria-live="polite">
          <p class="empty-state">还没有任何笔记，写下第一条灵感吧。</p>
        </div>
      </aside>

      <main class="editor-panel">
        <header class="editor-intro">
          <p class="intro-eyebrow">今日写作</p>
          <h1>一张清爽的笔记纸</h1>
          <p>标题和正文保留在同一张卡片内，保存后即可在左侧列表中快速浏览。</p>
        </header>

        <form id="note-form" class="note-form" autocomplete="off">
          <section class="editor-card">
            <div class="editor-heading">
              <label class="visually-hidden" for="title">标题</label>
              <input
                id="title"
                name="title"
                type="text"
                placeholder="写下标题"
                required
              />
              <time id="composer-time" aria-live="polite"></time>
            </div>
            <div class="editor-body">
              <label class="visually-hidden" for="content">内容</label>
              <textarea
                id="content"
                name="content"
                rows="10"
                placeholder="继续记录想法、任务或灵感细节。"
                required
              ></textarea>
            </div>
            <footer class="editor-footer">
              <p class="form-feedback" role="alert" aria-live="polite"></p>
              <button type="submit" class="primary-button">保存笔记</button>
            </footer>
          </section>
        </form>
      </main>
    </div>
    <script src="/static/js/main.js" defer></script>
  </body>
</html>

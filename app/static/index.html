<!doctype html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>流光笔记</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/css/style.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="笔记集">
        <header class="sidebar-header">
          <div class="brand">
            <span class="brand-symbol" aria-hidden="true"></span>
            <div>
              <p class="brand-title">流光笔记</p>
              <p class="brand-subtitle">绿色灵感的留白空间</p>
            </div>
          </div>
          <p class="sidebar-hint">在宁静的白色背景上，让灵感流入左侧的收藏与右侧的书写台。</p>
          <dl class="sidebar-stats" role="list">
            <div role="listitem">
              <dt>灵感总数</dt>
              <dd id="total-notes">0</dd>
            </div>
            <div role="listitem">
              <dt>近七日</dt>
              <dd id="weekly-notes">0</dd>
            </div>
          </dl>
        </header>
        <div class="sidebar-actions">
          <button
            type="button"
            class="pill-action"
            onclick="document.querySelector('#title').focus()"
          >
            <span aria-hidden="true">＋</span>
            <span>开始一条灵感</span>
          </button>
        </div>
        <div id="notes-list" class="notes-list" aria-live="polite">
          <p class="empty-state">还没有记录。写下第一缕灵感，让面板焕然一新。</p>
        </div>
      </aside>

      <main class="workspace">
        <header class="workspace-hero">
          <div>
            <p class="hero-eyebrow">今日写作状态</p>
            <h1>绿意流光写作台</h1>
            <p>标题与正文保存在同一张浮光玻璃中，安静又清爽。</p>
          </div>
          <button
            type="button"
            class="ghost-action"
            onclick="document.querySelector('#title').focus()"
          >
            聚焦写作
          </button>
        </header>

        <form id="note-form" class="note-form" autocomplete="off">
          <section class="composer">
            <div class="composer-header">
              <label class="visually-hidden" for="title">标题</label>
              <input
                id="title"
                name="title"
                type="text"
                placeholder="在这里写下标题与主要想法"
                required
              />
              <time id="composer-time" aria-live="polite"></time>
            </div>
            <div class="composer-body">
              <label class="visually-hidden" for="content">内容</label>
              <textarea
                id="content"
                name="content"
                rows="10"
                placeholder="继续扩展你的灵感、待办或要点，让整张卡片保持呼吸感。"
                required
              ></textarea>
            </div>
            <footer class="composer-footer">
              <p class="form-feedback" role="alert" aria-live="polite"></p>
              <button type="submit" class="primary-button">完成记录</button>
            </footer>
          </section>
        </form>
      </main>
    </div>
    <script src="/static/js/main.js" defer></script>
  </body>
</html>

<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}노트 앱{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
  </head>
  <body>
    <div class="app-shell">
      <header class="app-header">
        <h1 class="app-title">Liquid Notes</h1>
        <p class="app-subtitle">맑고 유려한 경험으로 간편하게 노트를 정리하세요.</p>
      </header>
      <main>
        {% block content %}{% endblock %}
      </main>
      <footer class="app-footer">Made with Flask · PostgreSQL Ready</footer>
    </div>
    <script src="{{ url_for('static', filename='js/main.js') }}" defer></script>
  </body>
</html>

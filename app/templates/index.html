{% extends "base.html" %}

{% block title %}Liquid Notes{% endblock %}

{% block content %}
<section class="note-dashboard">
  <form id="note-form" class="note-form" autocomplete="off">
    <div class="glass-card">
      <label for="title">제목</label>
      <input id="title" name="title" type="text" placeholder="오늘의 영감" required />
    </div>
    <div class="glass-card">
      <label for="content">내용</label>
      <textarea id="content" name="content" rows="5" placeholder="생각을 자유롭게 기록하세요" required></textarea>
    </div>
    <button type="submit" class="primary-button">노트 저장</button>
    <p class="form-feedback" role="alert" aria-live="polite"></p>
  </form>

  <section class="notes-board" aria-live="polite">
    <h2>나의 노트</h2>
    <div id="notes-list" class="notes-grid">
      {% for note in notes %}
      <article class="note-card" data-id="{{ note.id }}">
        <header>
          <h3>{{ note.title }}</h3>
          <time datetime="{{ note.updated_at.isoformat() }}">{{ note.updated_at.strftime('%Y.%m.%d %H:%M') }}</time>
        </header>
        <p>{{ note.content }}</p>
        <footer>
          <button type="button" class="icon-button" data-action="edit">수정</button>
          <button type="button" class="icon-button" data-action="delete">삭제</button>
        </footer>
      </article>
      {% else %}
      <p class="empty-state">아직 노트가 없습니다. 새로운 노트를 작성해보세요!</p>
      {% endfor %}
    </div>
  </section>
</section>
{% endblock %}
